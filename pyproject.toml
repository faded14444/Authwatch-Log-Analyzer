[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "authwatch"
version = "0.3.0"
description = "Detect brute-force, password spraying and suspicious logons in Windows, Active Directory and Linux SSH logs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-evtx>=0.8",
    "rich>=13",
]
keywords = ["security", "soc", "blue-team", "windows", "evtx", "active-directory", "kerberos", "linux", "ssh", "detection", "mitre-attack"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Environment :: Console",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
authwatch = "authwatch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/authwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# test data contains real-world log lines, which are naturally long
"tests/*" = ["E501"]
